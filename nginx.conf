# ==============================================================================
# تاريخ التعديل: 2026-07-22
# الوظيفة: إعدادات Nginx المخصصة لتقديم الفرونت اند وتوجيه الـ API والـ Sockets
# السياق: يحل مشكلة "حدث خطأ في الاتصال بالخادم" بتوجيه طلبات /api و /socket.io لحاوية الباك اند مباشرة
# ==============================================================================
server {
    listen 80;
    server_name localhost;
    client_max_body_size 6m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ui-avatars.com; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلبات الـ API محلياً إلى حاوية الباك اند kmt_oms_backend
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # توجيه اتصالات WebSocket والإشعارات الفورية
    location /socket.io {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # مجلد الملفات المرفوعة
    location /uploads {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
